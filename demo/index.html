  <body>
    <main id="demo">
      <noscript>
        <h1>Wheel</h1>
        <p>
          An FFGL effect that shows your clip the way a single-chip DLP does, a
          red field, then green, then blue, through a spinning colour wheel, and
          models the retina that adds them up. A still eye sees the input
          exactly. A moving eye lands each colour somewhere else, and that's
          where the rainbow fringe comes from. None of it is drawn.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/wheel">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/wheel/">Project page and downloads</a></li>
          <li><a href="https://stoatworks-labs.com/software/wheel/guide/">User guide</a></li>
          <li><a href="https://github.com/stoatworks-labs/wheel">Source on GitHub</a></li>
        </ul>
      </noscript>
    </main>
